name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy Pillow pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean UltimateOutfitter.spec
      - name: Smoke-test the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UltimateOutfitter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateOutfitter-windows
          path: dist/UltimateOutfitter.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UltimateOutfitter.exe
