<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ultimate Outfitter 3D view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #333; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; left: 12px; bottom: 10px; color: #eee; font: 13px sans-serif;
            background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; display: none; }
  #help { position: absolute; right: 10px; bottom: 8px; color: rgba(255,255,255,.55); font: 11px sans-serif;
          text-shadow: 0 0 2px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="status"></div>
<div id="help">Left-drag: orbit · Right/middle-drag: pan · Wheel: zoom · F: frame</div>
<script>
  window.addEventListener('error', (e) => {
    const s = document.getElementById('status');
    s.textContent = '3D view error: ' + (e.message || e) + ' (your graphics driver may not support WebGL 2)';
    s.style.display = 'block';
  });
</script>
<script src="viewer.bundle.js"></script>
</body>
</html>
